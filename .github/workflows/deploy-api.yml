name: deploy-api
# main 의 게이트(checks)가 통과하면 API(Worker) 를 배포한다 — D1 마이그레이션 먼저
# 비밀값(CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID)이 없으면 배포는 건너뛴다 (실패 아님)
on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 비밀값 확인
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID 가 저장소 Secrets 에 없어 배포를 건너뜁니다" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci
      - name: D1 마이그레이션 (원격)
        if: steps.secrets.outputs.ok == 'true'
        working-directory: apps/api
        run: npx wrangler d1 migrations apply hav-db --remote
        env:
          CI: "1"
      - name: Worker 배포
        if: steps.secrets.outputs.ok == 'true'
        working-directory: apps/api
        run: npx wrangler deploy
      - name: 배포 확인
        if: steps.secrets.outputs.ok == 'true'
        run: |
          curl -fsS --retry 5 --retry-delay 3 https://tripfx-api.developfff.workers.dev/health | tee -a "$GITHUB_STEP_SUMMARY"
