name: recover-2026-10-30
# 한 번만 쓰는 복구 — 2026-10-29 D1 하루 읽기 한도 초과(오류 7500)로 API 가 500 · 마이그레이션 0004 · 0005 와 새 API 코드가 배포 못 됨 (작업 0080)
# 사용자 요청(채팅): "내일 오전 09:00 시되면 다시 니가 빌드를 다시해줘 컴퓨터가 꺼저도 스케줄 맞춰놓으면 가능한걸로 알아"
# 한도는 00:00 UTC(한국 09:00)에 다시 참 → 00:10 UTC 부터 여러 번 (이미 정상이면 아무것도 안 함)
#   GitHub 예약 실행은 몇 시간 늦을 수 있음 — 2026-10-29 rebuild-site 03:30 예약이 10:19 에 돎 · 그래서 시각을 여러 개
# 끝나면 이 파일은 지움 (cron 이 해마다 10월 30일에 돌지 않게 날짜도 검사함)
on:
  schedule:
    - cron: "10 0 30 10 *"
    - cron: "40 0 30 10 *"
    - cron: "20 1 30 10 *"
    - cron: "15 2 30 10 *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: recover-2026-10-30
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      API: https://tripfx-api.developfff.workers.dev
    steps:
      - name: 오늘 할 일인지
        id: when
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%F)" != "2026-10-30" ]; then
            echo "2026-10-30 이 아니라 건너뜀" >> "$GITHUB_STEP_SUMMARY"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: 이미 복구됐는지 (새 API 는 /tasks 에 snagsSince 가 있음 · 사이트에 "자료 없음" 이 없음)
        id: done
        if: steps.when.outputs.go == 'true'
        run: |
          if curl -fsS "$API/tasks" | grep -q '"snagsSince"' && ! curl -fsS https://tripfx.pages.dev/ | grep -q '자료 없음'; then
            echo "이미 정상 — 할 일 없음" >> "$GITHUB_STEP_SUMMARY"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: API 가 다시 읽히는지 (D1 한도가 풀렸는지 · 최대 10분)
        if: steps.when.outputs.go == 'true' && steps.done.outputs.skip == 'false'
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$API/fx/latest")
            echo "fx/latest $code"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "API 가 아직 500 — D1 한도가 안 풀린 듯 · 다음 예약에서 다시" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: API 배포 (마이그레이션 0004 · 0005 포함)
        if: steps.when.outputs.go == 'true' && steps.done.outputs.skip == 'false'
        run: |
          gh workflow run deploy-api.yml --ref main
          sleep 15
          id=$(gh run list --workflow deploy-api.yml --event workflow_dispatch --limit 1 --json databaseId -q '.[0].databaseId')
          gh run watch "$id" --exit-status
          curl -fsS "$API/tasks" | grep -q '"snagsSince"'
          echo "API 배포 끝 · /tasks 에 snags 있음" >> "$GITHUB_STEP_SUMMARY"

      - name: 사이트 다시 빌드
        if: steps.when.outputs.go == 'true' && steps.done.outputs.skip == 'false'
        run: |
          gh workflow run rebuild-site.yml --ref main
          sleep 15
          id=$(gh run list --workflow rebuild-site.yml --event workflow_dispatch --limit 1 --json databaseId -q '.[0].databaseId')
          gh run watch "$id" --exit-status

      - name: 사이트 확인 (빌드 최대 10분)
        if: steps.when.outputs.go == 'true' && steps.done.outputs.skip == 'false'
        run: |
          for i in $(seq 1 20); do
            if ! curl -fsS https://tripfx.pages.dev/ | grep -q '자료 없음'; then
              echo "사이트 정상 ($(date -u +%FT%TZ))" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            sleep 30
          done
          echo "사이트가 아직 '자료 없음'" >> "$GITHUB_STEP_SUMMARY"
          exit 1
